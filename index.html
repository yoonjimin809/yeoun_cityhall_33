<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서류패스 레이스 | 행복특별시 여운시청</title>
<style>
*{box-sizing:border-box}
:root{--navy:#193653;--navy2:#102a43;--paper:#f7f5ef;--line:#d7d9dc;--red:#b94242;--green:#2e7656}
body{margin:0;background:linear-gradient(135deg,#e9edf0,#f7f5ef);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#1d2b38;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.app{width:min(1100px,94vw);margin:24px auto 40px;background:white;min-height:calc(100vh - 64px);border-radius:18px;box-shadow:0 12px 40px #142b3a18;overflow:hidden}
.topbar{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:var(--navy2);color:white}
.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:25px;min-width:92px;text-align:right}
.timer.warning{color:#ffd06a}
.screen{padding:38px}
.hidden{display:none!important}
.cover{padding:0 0 38px}
.cover img{display:block;width:100%;max-height:620px;object-fit:cover}
.cover-action{padding:30px 38px 0;text-align:center}
.primary{border:0;background:var(--navy);color:white;border-radius:10px;padding:16px 38px;font-size:18px;font-weight:800;box-shadow:0 5px 0 #0d2235;transition:.12s}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #0d2235}
.rules{max-width:820px;margin:auto}
.eyebrow{font-size:13px;font-weight:800;color:#657889;letter-spacing:.08em}
h1{margin:8px 0 20px;color:var(--navy2);font-size:32px;letter-spacing:-.05em}
.rule-box{background:#f5f7f8;border:1px solid #e0e4e7;border-radius:14px;padding:26px;line-height:1.9;font-size:17px}
.rule-box strong{color:var(--navy)}
.rule-list{margin:18px 0 0;padding-left:22px}
.rule-list li{margin:7px 0}
.start-wrap{text-align:center;margin-top:28px}
.game{max-width:850px;margin:auto}
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#6d7c88;font-size:14px;font-weight:700}
.progressbar{height:7px;background:#e7eaec;border-radius:99px;overflow:hidden;margin-bottom:25px}
.progressbar span{display:block;height:100%;background:var(--navy);transition:width .2s}
.paper{background:#fffdf8;border:1px solid #d8d5ca;border-radius:14px;padding:28px;box-shadow:0 8px 24px #1a2c3c0d}
.agency{font-size:24px;font-weight:900;color:var(--navy2);margin-bottom:22px;letter-spacing:-.04em}
.field{margin:15px 0}
.label{display:block;font-size:13px;color:#73808a;font-weight:800;margin-bottom:5px}
.value{font-size:17px;font-weight:700;line-height:1.55}
.content{font-size:16px;line-height:1.8;background:#f7f7f4;padding:16px;border-radius:9px}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}
.choice{border:2px solid #cbd1d6;background:white;border-radius:12px;padding:18px 12px;font-size:18px;font-weight:900;color:#263744;transition:.15s}
.choice:hover{border-color:var(--navy);background:#f6f9fb}
.choice.selected{border-color:var(--navy);background:#eaf0f5}
.box{display:inline-flex;width:23px;height:23px;border:2px solid #7f8991;margin-right:9px;vertical-align:-5px;align-items:center;justify-content:center;font-size:17px}
.selected .box::after{content:"✓";color:var(--navy);font-weight:900}
.feedback{margin-top:22px;border-radius:12px;padding:20px;line-height:1.7}
.feedback.correct{background:#edf7f1;border:1px solid #b9dbc8;color:#235d43}
.feedback.wrong{background:#fbefef;border:1px solid #e5baba;color:#7b2c2c}
.feedback-title{font-size:20px;font-weight:900;margin-bottom:7px}
.next-wrap{text-align:right;margin-top:18px}
.next{border:0;background:var(--navy);color:white;padding:12px 22px;border-radius:9px;font-weight:800;font-size:15px}
.result{text-align:center;max-width:720px;margin:60px auto}
.result-icon{font-size:58px;margin-bottom:15px}
.result h2{font-size:32px;color:var(--navy2);letter-spacing:-.05em;line-height:1.45}
.score{font-size:26px;font-weight:900;margin:25px 0;color:var(--navy)}
.retry{margin-top:10px;background:white;color:var(--navy);border:2px solid var(--navy)}
@media(max-width:650px){
.app{width:100%;margin:0;border-radius:0;min-height:100vh}
.topbar{padding:0 18px}
.screen{padding:22px 17px}
.cover-action{padding:22px 18px 0}
h1{font-size:27px}
.rule-box{font-size:15px;padding:20px}
.choice-row{grid-template-columns:1fr}
.paper{padding:20px}
.agency{font-size:21px}
}
</style>
</head>

<script>
const questions = [{"agency": "부산항만공사", "name": "부산항 물류 경쟁력 강화 사업", "content": "부산항의 항만시설을 관리·운영하고 항만물류 경쟁력을 높이기 위한 시설 개선 및 지원 사업", "answer": "approve", "explanation": "부산항만공사의 주요 업무와 관련된 사업이므로 승인."}, {"agency": "한국철도공사(코레일)", "name": "지역 관광 활성화 지원 사업", "content": "지역의 관광지를 홍보하고 관광객 유치를 위한 관광 콘텐츠를 개발하여 지역 관광산업의 활성화를 지원하는 사업", "answer": "reject", "explanation": "관광 활성화와 관광 콘텐츠 개발은 한국관광공사의 주요 업무와 관련된 사업이므로 코레일이 담당하기에는 적절하지 않음."}, {"agency": "국민연금공단", "name": "청년 건강검진 지원 사업", "content": "청년을 대상으로 건강검진 비용을 지원하고 건강관리 프로그램을 운영하여 건강한 생활을 돕는 사업", "answer": "reject", "explanation": "건강검진과 건강보험 관련 업무는 국민건강보험공단의 주요 업무와 관련되므로 국민연금공단이 담당하기에는 적절하지 않음."}, {"agency": "한국관광공사", "name": "국내 관광 활성화 사업", "content": "국내 여행 정보를 홍보하고 관광객의 여행 편의를 높이며 지역 관광산업의 활성화를 지원하는 사업", "answer": "approve", "explanation": "한국관광공사의 주요 업무인 관광 진흥 및 관광 활성화와 관련된 사업이므로 승인."}, {"agency": "한국토지주택공사(LH)", "name": "청년 주거 안정 지원 사업", "content": "청년과 신혼부부 등을 대상으로 공공임대주택을 공급하고 안정적인 주거환경을 지원하는 사업", "answer": "approve", "explanation": "공공주택 공급과 주거복지는 한국토지주택공사의 주요 업무와 관련되므로 승인."}, {"agency": "초록우산", "name": "대학생 학자금 지원 사업", "content": "경제적 부담으로 학업을 이어가기 어려운 대학생에게 등록금과 학자금을 지원하여 안정적인 대학 생활을 돕는 사업", "answer": "reject", "explanation": "대학생의 등록금 및 학자금 지원은 한국장학재단의 주요 업무와 관련된 사업이므로 초록우산이 담당하기에는 적절하지 않음."}, {"agency": "한국장학재단", "name": "대학생 국가장학금 지원 사업", "content": "대학생의 등록금 부담을 줄이기 위해 국가장학금을 지원하고 학자금 마련을 돕는 사업", "answer": "approve", "explanation": "국가장학금과 학자금 지원은 한국장학재단의 주요 업무와 관련되므로 승인."}, {"agency": "국민건강보험공단", "name": "노후 생활 안정 연금 지원 사업", "content": "국민의 노후 소득을 보장하기 위해 연금을 지급하고 연금 가입자의 안정적인 노후 준비를 지원하는 사업", "answer": "reject", "explanation": "연금 가입과 연금 급여 등 국민연금 관련 업무는 국민연금공단의 주요 업무이므로 국민건강보험공단이 담당하기에는 적절하지 않음."}];
let current = 0, score = 0, timeLeft = 33, timerId = null, answered = false;

function show(id) {
  ["coverScreen","rulesScreen","gameScreen","resultScreen"].forEach(x => document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function showRules() { show("rulesScreen"); document.getElementById("timer").textContent = ""; }
function startGame() {
  current = 0; score = 0; timeLeft = 33; answered = false;
  show("gameScreen"); loadQuestion(); startTimer();
}
function startTimer() {
  clearInterval(timerId);
  updateTimer();
  timerId = setInterval(() => {
    timeLeft -= 1; updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      finishGame(true);
    }
  }, 1000);
}
function updateTimer() {
  const t = document.getElementById("timer");
  t.textContent = "⏱ " + timeLeft + "초";
  t.classList.toggle("warning", timeLeft <= 10);
}
function pauseTimer() { clearInterval(timerId); timerId = null; }
function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("progressText").textContent = `서류 ${current+1} / 8`;
  document.getElementById("scoreText").textContent = `현재 점수 ${score}`;
  document.getElementById("progressFill").style.width = `${((current+1)/8)*100}%`;
  document.getElementById("agency").textContent = q.agency;
  document.getElementById("name").textContent = q.name;
  document.getElementById("agency2").textContent = q.agency;
  document.getElementById("content").textContent = q.content;
  document.getElementById("nextWrap").classList.add("hidden");
  document.querySelectorAll(".choice").forEach(b => {
    b.classList.remove("selected");
    b.disabled = false;
  });
}
function choose(choice) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  if (choice === q.answer) score++;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.choice === choice) b.classList.add("selected");
  });
  document.getElementById("scoreText").textContent = `현재 점수 ${score}`;
  setTimeout(() => {
    if (current >= 7) {
      finishGame(false);
    } else {
      current++;
      loadQuestion();
    }
  }, 120);
}
function nextQuestion() {
  if (current >= 7) { finishGame(false); return; }
  current++;
  loadQuestion();
  startTimer();
}
function finishGame(timeout) {
  pauseTimer();
  show("resultScreen");
  document.getElementById("timer").textContent = "";
  const icon = document.getElementById("resultIcon");
  const title = document.getElementById("resultTitle");
  if (score === 8) {
    icon.textContent = "✓";
    title.textContent = "모든 서류를 올바르게 결재하셨습니다! 수고하셨습니다";
  } else if (score >= 5) {
    icon.textContent = "✓";
    title.textContent = "모든 서류를 결재하셨습니다!";
  } else {
    icon.textContent = "!";
    title.textContent = "서류 결재를 실패하셨습니다";
    title.innerHTML += "<br><small>아쉽게도 여운시청의 결재담당자가 되지 못하셨습니다</small>";
  }
  document.getElementById("resultScore").textContent = `${score}/8`;
}
function restart() {
  document.getElementById("timer").textContent = "";
  show("coverScreen");
}
</script>
</body>
